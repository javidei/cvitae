<main class="container"><header class="page-head"><div><p class="eyebrow">Notas compartidas</p><h1>Tablón</h1></div><p>Escribe ideas, listas o cualquier cosa que quieras guardar en este dispositivo.</p></header><form class="panel editor" id="note-form"><div class="field"><label for="note-title">Título</label><input id="note-title" name="title" maxlength="70" placeholder="Por ejemplo: Películas pendientes" required></div><div class="field"><label for="note-text">Nota</label><textarea id="note-text" name="text" maxlength="800" placeholder="Escribe aquí…" required></textarea></div><div class="form-actions"><button class="btn" type="submit">Guardar nota</button></div></form><section class="cards-grid" id="notes-list" aria-live="polite"></section></main>
