name: Actualizar estado de Thirty

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pause-thirty.yml'

permissions:
  contents: write

jobs:
  update-thirty-card:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Marcar Thirty como pausado
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          replacements = {
              '<a class="proj__card-link" href="https://javidei.github.io/colorines/" aria-label="Abrir Thirty"></a>':
              '<a class="proj__card-link" href="https://javidei.github.io/colorines/" aria-label="Abrir Thirty, proyecto pausado"></a>',
              '<span class="proj__eyebrow">Red social privada · Nostalgia 2000</span>':
              '<span class="proj__eyebrow">Proyecto pausado · Sigue en desarrollo</span>',
              'Una pequeña red social nostálgica para los amigos de siempre.\n              <span class="muted">Perfil, tablón, fotos, mensajes, gente, eventos y chat en una demo local sin conexiones externas.</span>':
              'Proyecto pausado temporalmente por las limitaciones de capacidad de almacenamiento necesarias para fotos, música y vídeos.\n              <span class="muted">Se sigue trabajando en su arquitectura, las funciones sociales y una futura conexión con backend.</span>',
              '<span class="chip">JavaScript</span><span class="chip">LocalStorage</span><span class="chip">Responsive</span>':
              '<span class="chip">Pausado</span><span class="chip">En desarrollo</span><span class="chip">Supabase previsto</span>',
              "navigator.serviceWorker.register('./service-worker.js?v=thirty-card-20260806-1', {":
              "navigator.serviceWorker.register('./service-worker.js?v=thirty-paused-20260806-1', {",
          }

          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f'No se encontró en index.html: {old[:80]}')
              html = html.replace(old, new, 1)

          index.write_text(html, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_replacements = {
              'const CACHE_NAME = `${CACHE_PREFIX}v8-thirty`;':
              'const CACHE_NAME = `${CACHE_PREFIX}v9-thirty-paused`;',
              '<a class="proj__card-link" href="https://javidei.github.io/colorines/" aria-label="Abrir Thirty"></a>':
              '<a class="proj__card-link" href="https://javidei.github.io/colorines/" aria-label="Abrir Thirty, proyecto pausado"></a>',
              '<span class="proj__eyebrow">Red social privada · Nostalgia 2000</span>':
              '<span class="proj__eyebrow">Proyecto pausado · Sigue en desarrollo</span>',
              'Una pequeña red social nostálgica para los amigos de siempre.\n              <span class="muted">Perfil, tablón, fotos, mensajes, gente, eventos y chat en una demo local sin conexiones externas.</span>':
              'Proyecto pausado temporalmente por las limitaciones de capacidad de almacenamiento necesarias para fotos, música y vídeos.\n              <span class="muted">Se sigue trabajando en su arquitectura, las funciones sociales y una futura conexión con backend.</span>',
              '<span class="chip">JavaScript</span><span class="chip">LocalStorage</span><span class="chip">Responsive</span>':
              '<span class="chip">Pausado</span><span class="chip">En desarrollo</span><span class="chip">Supabase previsto</span>',
          }

          for old, new in sw_replacements.items():
              if old not in sw_text:
                  raise SystemExit(f'No se encontró en service-worker.js: {old[:80]}')
              sw_text = sw_text.replace(old, new, 1)

          sw.write_text(sw_text, encoding='utf-8')
          Path('.github/workflows/pause-thirty.yml').unlink()
          PY

      - name: Subir a main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js .github/workflows/pause-thirty.yml
          git commit -m "Marca Thirty como proyecto pausado"
          git push origin main
